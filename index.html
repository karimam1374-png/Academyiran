<style>
:root{--bg:#f1f6ff;--c:#fff;--t:#0f1f3d;--m:#5b6b8c;--a:#1d4ed8;--a2:#3b82f6;--l:#d6e2f7;--soft:#e8f0ff;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--bd:#b91c1c;--bdb:#fee2e2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0b1630;--c:#13213f;--t:#e6eeff;--m:#9db0d4;--a:#60a5fa;--a2:#3b82f6;--l:#26396a;--soft:#1a2c55;--ok:#4ade80;--okb:#14532d;--wn:#fbbf24;--wnb:#422006;--bd:#f87171;--bdb:#450a0a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--t);font-family:Yekan,Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.8;font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:0 14px 90px}
.top{position:sticky;top:0;z-index:20;margin:0 -14px 12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(135deg,#1e40af,#2563eb 60%,#3b82f6);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px #1e3a8a33}
.top b{font-size:18px;flex:1}.top small{display:block;font-size:12px;opacity:.9;font-weight:400}
.top button{background:#ffffff26;color:#fff;border:0;border-radius:12px;width:40px;height:40px;font-size:20px;padding:0;width:40px}
.logo{width:42px;height:42px;flex:0 0 42px}
.k{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}
.k h3{margin:0 0 8px;font-size:16.5px}
.m{color:var(--m);font-size:13.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cd{display:block;width:100%;text-align:center;background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px 8px;color:var(--t);font:inherit;cursor:pointer}
.cd .i{font-size:30px;line-height:1.3}.cd b{display:block;font-size:15px}.cd small{display:block;color:var(--m);font-size:12px}
.cd.big{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:0;text-align:right;padding:16px;display:flex;gap:14px;align-items:center}.cd.big small{color:#e0ecff;font-size:13px}.cd.big .i{font-size:38px}
.sec{font-size:13px;color:var(--m);margin:16px 4px 8px;font-weight:700}
button{font:inherit;cursor:pointer}
.bt{display:block;width:100%;border:0;border-radius:12px;padding:12px 14px;background:var(--a);color:#fff;font-weight:700;font-size:16px;margin:6px 0}
@media(prefers-color-scheme:dark){.bt{color:#0b1630}}
.bt.g{background:transparent;color:var(--a);border:2px solid var(--a)}.bt.r{background:var(--bdb);color:var(--bd)}.bt.s{display:inline-block;width:auto;padding:7px 12px;font-size:14px;margin:2px}

 return`<div class="ipg" style="width:760px">${HEAD('برنامه مطالعاتی')}<div style="padding:20px 26px"><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px"><div><span style="color:#5b6b8c">دانش‌آموز</span><br><b style="font-size:22px">${E(st.n)}</b><div style="font-size:14px;color:#475569">${E(p.title||'')}</div></div><div style="text-align:center"><div style="font-size:30px;font-weight:800;color:#1d4ed8">${E(fd(pr))}٪</div><div style="font-size:12px;color:#5b6b8c">انجام‌شده</div></div></div><div style="height:12px;background:#dbeafe;border-radius:8px;overflow:hidden;margin-bottom:14px"><div style="height:100%;width:${pr}%;background:#16a34a"></div></div>${b}</div>${FOOT()}</div>`}

function showImg(blob,name,cap,onSent,st){if(!blob)return;const f=new File([blob],name,{type:'image/jpeg'}),url=URL.createObjectURL(blob);let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
 const o=$('#ov');o.className='on';o.innerHTML=`<div class="im"><img src="${url}" alt=""></div><div class="bar"><p class="m" id="om" style="text-align:center;margin:0 0 6px">${can?'عکس آماده است. «ارسال» را بزنید و ایتا (یا بله) را انتخاب کنید.':'ارسال مستقیم در این مرورگر ممکن نیست. «ذخیره عکس» را بزنید و از داخل ایتا بفرستید.'}</p>${can?'<button class="bt" id="ogo">📤 ارسال (ایتا، بله، ...)</button>':''}<button class="bt g" id="osv">💾 ذخیره عکس</button>${cap?'<button class="bt g" id="ocp">📋 کپی متن کپشن</button>':''}${st&&st.eitaa?`<a class="bt g" style="text-align:center;text-decoration:none" href="https://eitaa.com/${E(String(st.eitaa).replace(/^@/,''))}" target="_blank" rel="noopener">باز کردن چت ایتا اولیا</a>`:''}<button class="bt r" id="ox">✕ بستن</button></div>`;
 const m=$('#om'),close=()=>{o.className='';o.innerHTML='';URL.revokeObjectURL(url)};$('#ox').onclick=close;$('#osv').onclick=()=>{dlFile(f);m.textContent='ذخیره شد (معمولاً پوشه‌ی دانلودها).'};
